get:
  operationId: getGoal
  tags:
    - goals
  summary: Get a single goal with chart data
  description: |
    Returns a single goal owned by the authenticated user, augmented with
    `chart_data` (the most recent 7 periods of actual vs target activity)
    and top-level `status` (the most recently completed period's outcome,
    forced to `pending` if the goal is snoozed).

    Period boundaries use the user's profile timezone (`users.timezone`).
    Day periods span local calendar days. Week periods span ISO 8601
    Monday-Sunday weeks in the user's timezone.

    Requests for a goal owned by a different user return 404 (not 403) to
    avoid leaking goal-id existence.
  parameters:
    - name: goal_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Goal with chart data
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/GoalWithChart.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
patch:
  operationId: updateGoal
  tags:
    - goals
  summary: Update a goal
  description: |
    Partially updates a goal owned by the authenticated user. Only the
    fields present in the body change; omitted fields are left untouched.
    Returns the updated goal in the `Goal` shape (no `chart_data`).

    `type` and `delta` are immutable — sending either returns 400. An empty
    body, or filter arrays inconsistent with the goal's `type`, also return
    400.

    Requests for a goal owned by a different user return 404 (not 403) to
    avoid leaking goal-id existence.
  parameters:
    - name: goal_id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/GoalUpdate.yaml
  responses:
    '200':
      description: Updated goal
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/Goal.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
delete:
  operationId: deleteGoal
  tags:
    - goals
  summary: Delete a goal
  description: |
    Permanently deletes a goal owned by the authenticated user. Returns 204
    with no body on success.

    Requests for a goal owned by a different user (or an unknown id) return
    404 (not 403) to avoid leaking goal-id existence.
  parameters:
    - name: goal_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Goal deleted
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
    '404':
      $ref: ../../components/responses/NotFound.yaml
