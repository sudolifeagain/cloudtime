get:
  operationId: getGoals
  tags:
    - goals
  summary: List user's goals
  description: |
    Returns the authenticated user's goals ordered by `created_at` ascending.
    Each entry conforms to the `Goal` schema, which includes only persisted
    goal fields. `chart_data` and `status` are NOT computed for the list
    endpoint — clients that need per-period progress must request each goal
    individually via
    `GET /users/current/goals/{goal_id}`.

    Optional `enabled` and `snoozed` query parameters filter on
    `is_enabled` / `is_snoozed` respectively. Omitting a filter returns
    goals regardless of that flag. When both are provided they are AND'd.
  parameters:
    - name: enabled
      in: query
      required: false
      schema:
        type: boolean
      description: |
        When `true`, return only enabled goals. When `false`, only disabled
        goals. Omit to include both.
    - name: snoozed
      in: query
      required: false
      schema:
        type: boolean
      description: |
        When `true`, return only snoozed goals. When `false`, only
        non-snoozed goals. Omit to include both.
  responses:
    '200':
      description: List of goals
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/Goal.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
post:
  operationId: createGoal
  tags:
    - goals
  summary: Create a goal
  description: |
    Creates a goal for the authenticated user and returns it in the same
    `Goal` shape as the list endpoint (persisted fields only, no
    `chart_data`).

    Server-generated fields (`id`, `created_at`, `modified_at`) are assigned
    by the server and ignored if present in the request body. Booleans
    default to `is_enabled=true`, `is_snoozed=false`, `is_inverse=false`.

    Validation failures (empty title, out-of-range `target_seconds`, unknown
    `type` / `delta`, or filter arrays inconsistent with `type`) return 400.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/GoalInput.yaml
  responses:
    '201':
      description: Goal created
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/Goal.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
