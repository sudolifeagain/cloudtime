get:
  operationId: getGoals
  tags:
    - goals
  summary: List user's goals
  description: |
    Returns the authenticated user's goals ordered by `created_at` ascending.
    Each entry conforms to the `Goal` schema, which includes only persisted
    goal fields. `chart_data` and `status` are NOT computed for the list
    endpoint — clients that need per-period progress must request each goal
    individually via
    `GET /users/current/goals/{goal_id}`.

    Optional `enabled` and `snoozed` query parameters filter on
    `is_enabled` / `is_snoozed` respectively. Omitting a filter returns
    goals regardless of that flag. When both are provided they are AND'd.
  parameters:
    - name: enabled
      in: query
      required: false
      schema:
        type: boolean
      description: |
        When `true`, return only enabled goals. When `false`, only disabled
        goals. Omit to include both.
    - name: snoozed
      in: query
      required: false
      schema:
        type: boolean
      description: |
        When `true`, return only snoozed goals. When `false`, only
        non-snoozed goals. Omit to include both.
  responses:
    '200':
      description: List of goals
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/Goal.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
