get:
  operationId: getProjectCommits
  tags:
    - commits
  summary: List commits for a project with coding time
  description: |
    Returns a page of the authenticated user's commits for `project`, ordered
    by `author_date` descending, 100 per page. `page` defaults to 1; the
    response includes `page` and `total_pages`. Optional `author` (matches
    `author_email`) and `branch` (matches the commit `ref`) filter the
    results. `human_readable_total` is derived from `total_seconds`.

    Commits are stored in the `commits` table and populated via the `POST`
    ingestion endpoint below (a git `post-commit` hook or a webhook adapter
    posts each commit). The list is empty until commits are ingested. An
    invalid `page` returns 400.
  parameters:
    - name: project
      in: path
      required: true
      schema:
        type: string
    - name: author
      in: query
      schema:
        type: string
    - name: branch
      in: query
      schema:
        type: string
    - name: page
      in: query
      description: 1-based page number. Defaults to 1; values below 1 return 400.
      schema:
        type: integer
        minimum: 1
        default: 1
  responses:
    '200':
      description: List of commits
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - page
              - total_pages
            properties:
              data:
                type: array
                items:
                  $ref: ../../components/schemas/Commit.yaml
              page:
                type: integer
                minimum: 1
              total_pages:
                type: integer
                minimum: 0
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
post:
  operationId: createProjectCommit
  tags:
    - commits
  summary: Ingest a commit for a project
  description: |
    Records one commit for the authenticated user under `project` (taken from
    the path; any `project` in the body is ignored). Intended for a git
    `post-commit` hook or a webhook adapter.

    Idempotent on `(user_id, project, hash)`: re-posting the same `hash`
    updates the existing row in place (message, author/committer fields,
    `total_seconds`, `ref`, `url`) rather than creating a duplicate, so hooks
    can be retried safely. Always returns 201 with the stored `Commit`.

    `hash` is required and must be non-empty. `total_seconds` is the optional
    coding time for the commit; when present it must be a number >= 0 and is
    stored verbatim. When it is omitted, the server derives the commit's coding
    time by correlating the user's heartbeats for this project in a bounded
    window ending at `author_date` (falling back to the ingest time) and bounded
    below by the previous commit, using the same session-timeout rule as the
    daily summaries; if no heartbeats fall in the window the value stays absent.
    `author_date` and `committer_date`, when present, must be valid date-times.
    `ref` is the branch (the read endpoints filter `branch` against it).
    Validation failures return 400.
  parameters:
    - name: project
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/CommitInput.yaml
  responses:
    '201':
      description: Commit ingested
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/Commit.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
