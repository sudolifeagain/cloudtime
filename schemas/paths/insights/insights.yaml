get:
  operationId: getInsight
  tags:
    - insights
  summary: Coding activity insights
  description: |
    Derives an insight of the requested `insight_type` over `range` from the
    pre-aggregated `summaries` table (no raw-heartbeat scan). All listed
    insight types ship in the first cut; an `hours`-of-day insight is
    intentionally absent because `summaries` has day granularity only (it
    would require an hourly aggregate - a future addition).

    `range` accepts `last_7_days`, `last_30_days`, `last_6_months`,
    `last_year`, `all_time`, or `YYYY` / `YYYY-MM`, interpreted in the user's
    profile timezone (same vocabulary as `GET /stats/{range}`). An
    invalid `insight_type` or unrecognised range returns 400.

    Which `Insight` field is populated depends on `insight_type`:
    - `days` -> `days[]` (per-day totals across the range; restricted to a
      single weekday when the `weekday` query parameter is set).
    - `best_day` -> `best_day` (the single highest-total day).
    - `daily_average` -> `daily_average` (mean seconds per active day).
    - `weekday` -> `items[]`, one per weekday (`name` = Monday-Sunday),
      `total_seconds` = mean for that weekday, ordered most-active first.
    - `projects` / `languages` / `editors` / `categories` / `machines` /
      `operating_systems` -> `items[]`, top values of that dimension by
      `total_seconds` (with `percent` of the range total).

    The `weekday` query parameter filters the `days` insight type to a single
    day of the week (see the parameter definition for accepted values); it is
    ignored by every other insight type. The `timeout` and `writes_only` query
    parameters remain accepted for forward-compatibility but are not applied:
    insights read from `summaries`, which already bake in each user's session
    timeout and do not retain per-heartbeat write flags.
  parameters:
    - name: insight_type
      in: path
      required: true
      schema:
        type: string
        enum:
          - weekday
          - days
          - best_day
          - daily_average
          - projects
          - languages
          - editors
          - categories
          - machines
          - operating_systems
    - name: range
      in: path
      required: true
      schema:
        type: string
        description: >-
          last_7_days, last_30_days, last_6_months, last_year, all_time, or YYYY
          / YYYY-MM
    - name: timeout
      in: query
      schema:
        type: integer
    - name: writes_only
      in: query
      schema:
        type: boolean
    - name: weekday
      in: query
      description: >-
        Restricts the `days` insight type to a single day of the week. Accepts an
        integer 0-6 (0=Sunday ... 6=Saturday) or a case-insensitive English weekday
        name (sunday ... saturday). Ignored by all other insight types. For the
        `days` type, an out-of-range integer or unrecognised name returns 400.
      schema:
        type: string
  responses:
    '200':
      description: Insight data
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../../components/schemas/Insight.yaml
    '400':
      $ref: ../../components/responses/BadRequest.yaml
    '401':
      $ref: ../../components/responses/Unauthorized.yaml
