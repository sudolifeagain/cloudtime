type: object
required:
  - entity
  - type
  - time
properties:
  entity:
    type: string
    maxLength: 4096
    description: File path, app name, or domain
  type:
    type: string
    enum:
      - file
      - app
      - domain
      - url
      - event
  time:
    type: number
    format: double
    description: UNIX epoch timestamp
  category:
    $ref: ./Category.yaml
  project:
    type: string
    maxLength: 255
  project_root_count:
    type: integer
  branch:
    type: string
    maxLength: 255
  language:
    type: string
    maxLength: 255
  dependencies:
    description: Dependency names, as comma-separated string or array
    oneOf:
      - type: string
        maxLength: 8192
        description: Comma-separated dependency names
      - type: array
        maxItems: 100
        items:
          type: string
          maxLength: 255
        description: Array of dependency names
  lines:
    type: integer
  ai_line_changes:
    type: integer
  human_line_changes:
    type: integer
  ai_session:
    type: string
    maxLength: 255
    description: |
      Opaque identifier for the AI coding session the heartbeat belongs to,
      as reported by a compatible client. Stored verbatim; never parsed for
      prompt or response content.
  ai_subscription_plan:
    type: string
    maxLength: 255
    description: |
      Subscription/plan label reported by a compatible client (e.g. a plan
      name). Retained for grouping only; CloudTime never treats it as a
      billing source.
  ai_prompt_length:
    type: integer
    minimum: 0
    description: Prompt length in characters or tokens as reported by the client.
  ai_input_tokens:
    type: integer
    minimum: 0
    description: Input (prompt) tokens billed for this AI interaction.
  ai_output_tokens:
    type: integer
    minimum: 0
    description: Output (completion) tokens billed for this AI interaction.
  ai_cached_input_tokens:
    type: integer
    minimum: 0
    description: |
      Input tokens served from a provider prompt cache, priced separately from
      fresh input tokens by some providers.
  ai_reasoning_output_tokens:
    type: integer
    minimum: 0
    description: |
      Reasoning/thinking output tokens, priced separately from visible output
      tokens by some providers.
  ai_cache_write_tokens:
    type: integer
    minimum: 0
    description: Tokens written to a provider prompt cache (cache-creation class).
  ai_cache_read_tokens:
    type: integer
    minimum: 0
    description: Tokens read from a provider prompt cache (cache-hit class).
  ai_provider:
    type: string
    maxLength: 255
    description: |
      Provider identifier for the AI model, when a compatible client supplies
      it (e.g. `openai`, `anthropic`). When absent, CloudTime derives it
      best-effort from stored user-agent metadata.
  ai_model:
    type: string
    maxLength: 255
    description: |
      Model identifier for the AI interaction, when a compatible client
      supplies it (e.g. `gpt-4o`, `claude-opus-4`). When absent, CloudTime
      derives it best-effort from stored user-agent metadata.
  lineno:
    type: integer
  cursorpos:
    type: integer
  is_write:
    type: boolean
  editor:
    type: string
    maxLength: 255
  operating_system:
    type: string
    maxLength: 255
  machine:
    type: string
    maxLength: 255
    description: Machine/device name
  user_agent:
    type: string
    maxLength: 512
    description: User agent string from editor plugin
