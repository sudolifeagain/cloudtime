type: object
required:
  - id
  - action
  - source
  - operation
  - source_value
  - destination
  - destination_value
properties:
  id:
    type: string
  action:
    type: string
    description: |
      `change` remaps the matched heartbeat's `destination` column to
      `destination_value`. `hide` drops the heartbeat from persistence
      (it is not stored or aggregated).
    enum:
      - change
      - hide
  source:
    type: string
    description: The heartbeat dimension matched against `source_value`.
    enum:
      - project
      - language
      - editor
      - operating_system
      - category
      - entity
  operation:
    type: string
    description: |
      How `source_value` is compared to the heartbeat's `source` field.
      Regex is intentionally unsupported in this version (Workers CPU
      budget); adding it later is additive.
    enum:
      - equals
      - contains
      - starts_with
      - ends_with
  source_value:
    type: string
  destination:
    type: string
    description: |
      The heartbeat dimension rewritten by a `change` action. Ignored for
      `hide` actions.
    enum:
      - project
      - language
      - editor
      - operating_system
      - category
      - entity
  destination_value:
    type: string
  priority:
    type: integer
    description: |
      Rules are applied in ascending priority order (lowest first). Ties
      break by `created_at`.
  created_at:
    type: string
    format: date-time
