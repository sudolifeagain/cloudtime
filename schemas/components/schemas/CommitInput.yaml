type: object
required:
  - hash
properties:
  hash:
    type: string
    minLength: 1
    maxLength: 64
  message:
    type: string
    maxLength: 4096
  author_name:
    type: string
    maxLength: 255
  author_email:
    type: string
    format: email
    maxLength: 254
  author_date:
    type: string
    format: date-time
  committer_name:
    type: string
    maxLength: 255
  committer_email:
    type: string
    format: email
    maxLength: 254
  committer_date:
    type: string
    format: date-time
  total_seconds:
    type: number
    format: double
    minimum: 0
    description: >-
      Client-supplied coding time in seconds for the commit. Optional; an
      explicit value (including 0) is stored verbatim. When omitted, the single
      `POST .../commits` endpoint derives it by correlating heartbeats around the
      commit, whereas bulk ingestion (`commits.bulk`) stores it absent — it does
      not correlate. See each operation.
  ref:
    type: string
    maxLength: 255
  url:
    type: string
    format: uri
    maxLength: 2048
