type: object
description: |
  Aggregated AI token facts and derived estimated cost for one grouping bucket
  (a day, project, agent, provider, or model).

  `estimated_cost` is an API-equivalent estimate computed from stored token
  counts and the effective owner pricing rows for each heartbeat's timestamp. It
  is NOT the owner's actual subscription bill. When no enabled price row matches
  a contributing heartbeat, that heartbeat's tokens are counted in
  `missing_price_count` and excluded from the cost sum. When every contributing
  heartbeat lacks a matching price, `estimated_cost` is `null` (never a silent
  zero).
required:
  - input_tokens
  - output_tokens
  - cached_input_tokens
  - reasoning_output_tokens
  - cache_write_tokens
  - cache_read_tokens
  - prompt_length_total
  - heartbeat_count
  - estimated_cost
  - missing_price_count
properties:
  input_tokens:
    type: integer
    minimum: 0
  output_tokens:
    type: integer
    minimum: 0
  cached_input_tokens:
    type: integer
    minimum: 0
  reasoning_output_tokens:
    type: integer
    minimum: 0
  cache_write_tokens:
    type: integer
    minimum: 0
  cache_read_tokens:
    type: integer
    minimum: 0
  prompt_length_total:
    type: integer
    minimum: 0
    description: Sum of reported `ai_prompt_length` for the bucket.
  prompt_length_avg:
    oneOf:
      - type: number
        format: double
        minimum: 0
      - type: 'null'
    description: |
      Mean reported prompt length across heartbeats that carried
      `ai_prompt_length`, or null when none did.
  heartbeat_count:
    type: integer
    minimum: 0
    description: Number of AI-category heartbeats contributing to the bucket.
  estimated_cost:
    oneOf:
      - type: number
        format: double
        minimum: 0
      - type: 'null'
    description: |
      API-equivalent estimated cost in the summary `currency`, or null when no
      contributing heartbeat matched an enabled price row.
  missing_price_count:
    type: integer
    minimum: 0
    description: |
      Number of contributing heartbeats with priced token fields but no matching
      enabled price row for their timestamp.
