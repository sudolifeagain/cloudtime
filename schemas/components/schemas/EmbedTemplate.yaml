type: object
required:
  - id
  - name
  - template_svg
  - created_at
  - modified_at
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    minLength: 1
    maxLength: 64
  template_svg:
    type: string
    description: Safe static SVG template containing recognized CloudTime placeholder tokens.
    minLength: 1
    maxLength: 20000
  created_at:
    type: string
    format: date-time
  modified_at:
    type: string
    format: date-time
