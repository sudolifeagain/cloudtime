name = "cloudtime"
main = "src/index.ts"
compatibility_date = "2025-03-09"

# D1 Database for heartbeats & statistics
[[d1_databases]]
binding = "DB"
database_name = "cloudtime-db"
database_id = "" # Set after: wrangler d1 create cloudtime-db

# KV Namespace for API key cache & session
[[kv_namespaces]]
binding = "KV"
id = "" # Set after: wrangler kv namespace create CLOUDTIME_KV

# Cron Triggers for periodic aggregation
[triggers]
crons = ["0 * * * *"] # Hourly aggregation

# Optional R2 bucket for user data exports (Issue #102). Uncomment and create
# the bucket (`wrangler r2 bucket create cloudtime-dumps`) to enable the
# /data_dumps endpoints; while unbound they fail closed with 503.
# See docs/operations.md.
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "cloudtime-dumps"

# Instance mode: "single" (default, one user) or "multi" (team/org)
[define]
__APP_VERSION__ = '"0.1.0"'

[vars]
INSTANCE_MODE = "single"
# HEARTBEAT_RETENTION_DAYS - Optional. Number of days of raw heartbeats to keep.
#                            Unset = retain forever. When set, the hourly cron
#                            purges older raw heartbeats; aggregated `summaries`
#                            are unaffected. See docs/operations.md.
# HEARTBEAT_RETENTION_DAYS = "90"
# PUBLIC_STATS - Optional. The unauthenticated global stats endpoint
#                (GET /api/v1/stats/{range}) aggregates all activity; on a
#                single-user instance that is the owner's coding profile.
#                Set to "false" (exact literal; trimmed, case-insensitive) to
#                disable the endpoint — it then returns 404 to every request
#                and does no cache/DB work. Unset or any other value = enabled
#                (backward-compatible default). Recommended "false" for
#                single-user instances. See docs/deployment-guide.md (Issue #156).
# PUBLIC_STATS = "false"

# OAuth & Session secrets (set via `wrangler secret put <NAME>`)
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# DISCORD_CLIENT_ID
# DISCORD_CLIENT_SECRET
# ENCRYPTION_KEY          - AES-256 key (64 hex chars) for encrypting OAuth tokens at rest
# GOOGLE_HOSTED_DOMAIN    - Optional. Google Workspace primary domain (e.g. "example.com").
#                           When set, Google logins are restricted to accounts whose id_token
#                           `hd` claim matches this value. See specs/037-google-hosted-domain/.
# EMAIL_PROVIDER          - Required in multi-user mode. Currently supports "resend".
#                           See docs/email-setup.md.
# EMAIL_FROM              - Required in multi-user mode. From address on a domain you control.
# RESEND_API_KEY          - Required when EMAIL_PROVIDER=resend. Bearer token from resend.com.

# OAuth rate limits — see specs/058-oauth-rate-limiting/
# Operators must verify current Cloudflare plan limits before production deployment.
[[ratelimits]]
name = "RATE_LIMIT_OAUTH_INITIATE"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RATE_LIMIT_OAUTH_CALLBACK"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 5
  period = 60
